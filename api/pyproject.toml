[project]
name = "wellbeing-api"
version = "0.2.0"
description = "AI-Based Student Wellbeing Monitoring System for Sri Lankan Schools - API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Makes `cd api && pytest` work without setting PYTHONPATH by hand.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
