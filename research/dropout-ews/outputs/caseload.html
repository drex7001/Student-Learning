<meta charset="utf-8" />
<title>Caseload — dropout early warning</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   The register.

   Design language borrowed from the object this tool replaces: a school
   attendance register. Ruled hairlines, ledger-stock ground, registrar's indigo
   for structure, and a warm ochre-to-rust ramp for how much adult attention a
   line needs. The ramp is deliberately NOT a traffic light: its low end is a
   pale neutral, never green, because nothing here marks a student as good.
   ───────────────────────────────────────────────────────────────────────────── */
:root {
  --paper:      #EDEEE8;
  --card:       #F7F8F4;
  --sunk:       #E3E5DD;
  --ink:        #1A1E1B;
  --ink-2:      #4C544E;
  --ink-3:      #79817A;
  --rule:       rgba(26, 30, 27, 0.14);
  --rule-firm:  rgba(26, 30, 27, 0.30);
  --indigo:     #37427E;
  --indigo-ink: #2B3466;
  --indigo-bg:  rgba(55, 66, 126, 0.09);
  --att1:       #8E978F;
  --att2:       #B5842A;
  --att3:       #9E3E2B;
  --att1-bg:    rgba(142, 151, 143, 0.16);
  --att2-bg:    rgba(181, 132, 42, 0.16);
  --att3-bg:    rgba(158, 62, 43, 0.14);
  --fill-low:   #C6CCC5;
  --good:       #3F6B52;

  --face-ui:   "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --face-name: "Iowan Old Style", Georgia, "Times New Roman", serif;
  --face-num:  "Cascadia Mono", Consolas, ui-monospace, "SF Mono", Menlo, monospace;

  --r: 2px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14171A; --card: #1B1F22; --sunk: #101315;
    --ink: #E8EAE5; --ink-2: #A8B0AA; --ink-3: #7C847E;
    --rule: rgba(232, 234, 229, 0.16); --rule-firm: rgba(232, 234, 229, 0.34);
    --indigo: #97A3E8; --indigo-ink: #B3BCF0; --indigo-bg: rgba(151, 163, 232, 0.14);
    --att1: #8A938C; --att2: #D6A343; --att3: #D2664E;
    --att1-bg: rgba(138, 147, 140, 0.20); --att2-bg: rgba(214, 163, 67, 0.18);
    --att3-bg: rgba(210, 102, 78, 0.18);
    --fill-low: #454C46;
    --good: #74A98A;
  }
}
:root[data-theme="dark"] {
  --paper: #14171A; --card: #1B1F22; --sunk: #101315;
  --ink: #E8EAE5; --ink-2: #A8B0AA; --ink-3: #7C847E;
  --rule: rgba(232, 234, 229, 0.16); --rule-firm: rgba(232, 234, 229, 0.34);
  --indigo: #97A3E8; --indigo-ink: #B3BCF0; --indigo-bg: rgba(151, 163, 232, 0.14);
  --att1: #8A938C; --att2: #D6A343; --att3: #D2664E;
  --att1-bg: rgba(138, 147, 140, 0.20); --att2-bg: rgba(214, 163, 67, 0.18);
  --att3-bg: rgba(210, 102, 78, 0.18);
  --fill-low: #454C46;
  --good: #74A98A;
}
:root[data-theme="light"] {
  --paper: #EDEEE8; --card: #F7F8F4; --sunk: #E3E5DD;
  --ink: #1A1E1B; --ink-2: #4C544E; --ink-3: #79817A;
  --rule: rgba(26, 30, 27, 0.14); --rule-firm: rgba(26, 30, 27, 0.30);
  --indigo: #37427E; --indigo-ink: #2B3466; --indigo-bg: rgba(55, 66, 126, 0.09);
  --att1: #8E978F; --att2: #B5842A; --att3: #9E3E2B;
  --att1-bg: rgba(142, 151, 143, 0.16); --att2-bg: rgba(181, 132, 42, 0.16);
  --att3-bg: rgba(158, 62, 43, 0.14);
  --fill-low: #C6CCC5;
  --good: #3F6B52;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--face-ui); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.num { font-family: var(--face-num); font-variant-numeric: tabular-nums; }

/* ── top strip ─────────────────────────────────────────────────────────────── */
.strip {
  display: flex; align-items: baseline; gap: 10px 18px; flex-wrap: wrap;
  padding: 7px 16px; border-bottom: 1px solid var(--rule-firm);
  background: var(--sunk); font-size: 11.5px; color: var(--ink-2);
}
.strip b { color: var(--ink); font-weight: 600; letter-spacing: 0.02em; }
.strip .sep { color: var(--ink-3); }
.strip .grow { flex: 1 1 auto; }
.themebtn {
  background: transparent; border: 1px solid var(--rule-firm); border-radius: var(--r);
  padding: 2px 9px; font-size: 11px; cursor: pointer; color: var(--ink-2);
}
.themebtn:hover { border-color: var(--indigo); color: var(--indigo); }

/* ── shell ─────────────────────────────────────────────────────────────────── */
.shell {
  display: grid; grid-template-columns: 336px minmax(0, 1fr);
  height: calc(100dvh - 33px); min-height: 480px;
}
.rail {
  border-right: 1px solid var(--rule-firm); overflow-y: auto;
  display: flex; flex-direction: column; background: var(--paper);
}
.record { overflow-y: auto; padding: 0 0 64px; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; height: auto; }
  .rail { border-right: 0; border-bottom: 1px solid var(--rule-firm); max-height: 62vh; }
  .record { overflow: visible; }
}

/* ── rail head ─────────────────────────────────────────────────────────────── */
.railhead { padding: 14px 14px 12px; border-bottom: 1px solid var(--rule); }
.eyebrow {
  font-size: 10.5px; letter-spacing: 0.11em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600;
}
.railhead h1 { font: 600 17px/1.25 var(--face-ui); margin: 3px 0 2px; letter-spacing: -0.01em; }
.railhead .sub { font-size: 11.5px; color: var(--ink-2); }

.ctrl { padding: 12px 14px; border-bottom: 1px solid var(--rule); }
.ctrl-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.ctrl label { font-size: 11px; color: var(--ink-2); }
.ctrl .val { font-size: 12.5px; font-weight: 600; }
input[type="range"] { width: 100%; margin: 8px 0 4px; accent-color: var(--indigo); }
.burden { display: flex; height: 9px; border-radius: 1px; overflow: hidden; margin: 8px 0 6px; }
.burden > span { display: block; }
.burden-note { font-size: 11px; color: var(--ink-2); line-height: 1.45; }
.burden-note b { color: var(--ink); font-weight: 600; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 10.5px; color: var(--ink-3); margin-top: 7px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 4px; }

.search {
  width: 100%; background: var(--card); border: 1px solid var(--rule-firm);
  border-radius: var(--r); padding: 6px 9px; font-size: 12.5px;
}
.sortrow { display: flex; gap: 6px; margin-top: 8px; }
.sorthint:not(:empty) { font-size: 11px; color: var(--ink-2); margin-top: 7px; line-height: 1.45; }
.gapmark { color: var(--att2); font-variant-numeric: tabular-nums; }
.aheadline {
  margin: 0 0 14px; padding: 9px 11px; border-radius: var(--r);
  border-left: 2px solid var(--att2); background: var(--att2-bg);
  font-size: 11.5px; line-height: 1.5; max-width: 82ch;
}
.aheadline b { font-weight: 600; }
.seg {
  flex: 1; text-align: center; padding: 4px 6px; font-size: 11px; cursor: pointer;
  border: 1px solid var(--rule-firm); border-radius: var(--r);
  background: transparent; color: var(--ink-2);
}
.seg[aria-pressed="true"] { background: var(--indigo-bg); border-color: var(--indigo); color: var(--indigo-ink); font-weight: 600; }

/* ── caseload list ─────────────────────────────────────────────────────────── */
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-bottom: 1px solid var(--rule); }
.row {
  width: 100%; display: grid; grid-template-columns: 3px 1fr auto; gap: 0 10px;
  align-items: center; background: transparent; border: 0; text-align: left;
  padding: 0; cursor: pointer; font: inherit;
}
.row:hover { background: var(--card); }
.row[aria-current="true"] { background: var(--indigo-bg); }
.row .stripe { align-self: stretch; min-height: 44px; }
.row .who { padding: 7px 0; min-width: 0; }
.row .id { font-family: var(--face-num); font-size: 12px; letter-spacing: -0.02em; }
.row[aria-current="true"] .id { font-weight: 700; color: var(--indigo-ink); }
.row .meta { font-size: 10.5px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; }
.row .p { padding: 7px 12px 7px 0; text-align: right; }
.row .pv { font-family: var(--face-num); font-size: 13px; font-variant-numeric: tabular-nums; }
.row .flag { font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.row[data-flagged="true"] .flag { color: var(--att3); font-weight: 700; }
.empty { padding: 22px 14px; font-size: 12px; color: var(--ink-3); }

/* ── record ────────────────────────────────────────────────────────────────── */
.rhead {
  padding: 18px 24px 16px; border-bottom: 1px solid var(--rule-firm);
  background: var(--card);
  position: sticky; top: 0; z-index: 5;
}
.rhead .idline { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.rhead h2 { font: 400 26px/1.15 var(--face-name); margin: 0; letter-spacing: -0.01em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 10.5px; padding: 2px 7px; border: 1px solid var(--rule-firm);
  border-radius: 999px; color: var(--ink-2);
}
.chip.synth { border-style: dashed; color: var(--ink-3); }

.riskwrap { display: flex; align-items: flex-end; gap: 22px; margin-top: 14px; flex-wrap: wrap; }
.bignum { display: flex; align-items: baseline; gap: 7px; }
.bignum .v {
  font-family: var(--face-num); font-size: 40px; line-height: 1; font-weight: 600;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.bignum .pct { font-size: 17px; color: var(--ink-2); }
.bandtag {
  font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  padding: 3px 9px; border-radius: var(--r);
}
.postbar { flex: 1 1 260px; min-width: 220px; }
.postbar .bars { display: flex; height: 22px; border-radius: 1px; overflow: hidden; }
.postbar .bars > span { display: flex; align-items: center; justify-content: center; font-size: 10px; }
.postbar .keys { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); margin-top: 4px; }
.basis { margin: 12px 0 0; font-size: 12px; color: var(--ink-2); max-width: 74ch; }
.basis b { color: var(--ink); font-weight: 600; }

/* ── panels ────────────────────────────────────────────────────────────────── */
.panel { padding: 22px 24px 4px; border-bottom: 1px solid var(--rule); }
.panel:last-of-type { border-bottom: 0; }
.ph { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 3px; }
.ph h3 { font: 600 14.5px/1.3 var(--face-ui); margin: 0; letter-spacing: -0.005em; }
.ph .count { font-size: 11px; color: var(--ink-3); font-family: var(--face-num); }
.note { font-size: 11.5px; color: var(--ink-2); margin: 0 0 14px; max-width: 78ch; line-height: 1.5; }
.note b { color: var(--ink); font-weight: 600; }
.note.tight { margin-bottom: 8px; }

/* screening matrix */
.mtx { overflow-x: auto; padding-bottom: 4px; }
table.grid { border-collapse: collapse; font-size: 12px; }
table.grid th, table.grid td { border: 1px solid var(--rule); padding: 5px 9px; text-align: right; }
table.grid th { font-weight: 600; font-size: 10.5px; color: var(--ink-2); text-align: left; white-space: nowrap; }
table.grid td { font-family: var(--face-num); font-variant-numeric: tabular-nums; }
table.grid td.here { outline: 2px solid var(--indigo); outline-offset: -2px; font-weight: 700; color: var(--indigo-ink); background: var(--indigo-bg); }
table.grid caption { caption-side: bottom; font-size: 10.5px; color: var(--ink-3); text-align: left; padding-top: 6px; }

/* driver / action rows */
.rows { display: flex; flex-direction: column; gap: 1px; margin-bottom: 12px; }
.dr {
  display: grid; grid-template-columns: minmax(140px, 1.15fr) minmax(88px, 0.75fr) 1fr 62px;
  gap: 10px; align-items: center; padding: 7px 8px; background: transparent;
  border: 0; border-radius: var(--r); text-align: left; cursor: pointer; font: inherit; width: 100%;
}
.dr:hover { background: var(--card); }
.dr[aria-expanded="true"] { background: var(--card); }
.dr .lbl { font-size: 12.5px; min-width: 0; }
.dr .st { font-size: 11.5px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; min-width: 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.track { height: 7px; background: var(--sunk); border-radius: 1px; position: relative; overflow: hidden; }
.track > span { position: absolute; top: 0; bottom: 0; }
.dr .amt { font-family: var(--face-num); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }

.route {
  margin: 2px 0 10px; padding: 11px 12px; background: var(--card);
  border-left: 2px solid var(--indigo); border-radius: 0 var(--r) var(--r) 0;
}
.route .cap { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px; font-weight: 600; }
.chain { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; }
.hop { border: 1px solid var(--rule-firm); border-radius: var(--r); padding: 4px 8px; background: var(--paper); }
.hop .hl { font-size: 11px; display: block; }
.hop .hs { font-size: 10.5px; color: var(--ink-2); display: block; font-family: var(--face-num); }
.arrow { align-self: center; color: var(--ink-3); font-size: 13px; }
.route .tail { font-size: 11px; color: var(--ink-2); margin: 8px 0 0; }

/* actions */
.act {
  display: grid; grid-template-columns: 22px 1fr auto; gap: 0 11px;
  padding: 11px 12px; border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--card); margin-bottom: 7px; align-items: start;
}
.act[data-on="true"] { border-color: var(--indigo); background: var(--indigo-bg); }
.act input[type="checkbox"] { width: 15px; height: 15px; margin: 2px 0 0; accent-color: var(--indigo); cursor: pointer; }
.act .body { min-width: 0; }
.act .an { font-size: 13px; font-weight: 600; }
.act .ao { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.act .ad { font-size: 11.5px; color: var(--ink-2); margin-top: 5px; max-width: 68ch; }
.act .caveat {
  font-size: 11px; margin-top: 7px; padding: 6px 8px; border-radius: var(--r);
  background: var(--att2-bg); color: var(--ink); border-left: 2px solid var(--att2);
}
.act .fx { text-align: right; white-space: nowrap; }
.act .fxd { font-family: var(--face-num); font-size: 14px; font-weight: 600; color: var(--good); font-variant-numeric: tabular-nums; }
.act .fxt { font-size: 10.5px; color: var(--ink-3); font-family: var(--face-num); }
.act .from { font-size: 11px; color: var(--ink-2); margin-top: 4px; }

/* Summary before detail, and deliberately not sticky: a bottom-sticky bar inside a tall
   section hovers over the very cards it is summarising. */
.plan {
  margin: 0 0 14px; padding: 10px 12px; border-radius: var(--r);
  background: var(--sunk); border: 1px solid var(--rule);
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.plan[data-active="true"] { border-color: var(--indigo); background: var(--indigo-bg); }
.plan .pl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.plan .pv { font-family: var(--face-num); font-size: 15px; font-variant-numeric: tabular-nums; }
.plan .pd { font-family: var(--face-num); font-size: 15px; font-weight: 700; color: var(--good); }
.plan .grow { flex: 1 1 auto; }
.linkbtn {
  background: transparent; border: 1px solid var(--rule-firm); border-radius: var(--r);
  padding: 3px 10px; font-size: 11.5px; cursor: pointer; color: var(--ink-2);
}
.linkbtn:hover { border-color: var(--indigo); color: var(--indigo); }

/* record chips */
.groups { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
.grp .gl {
  font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3);
  font-weight: 600; margin-bottom: 5px;
}
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); gap: 5px; }
.field {
  display: flex; align-items: center; gap: 7px; padding: 5px 8px;
  border: 1px solid var(--rule); border-radius: var(--r); background: var(--card); min-width: 0;
}
.field .fl { font-size: 11.5px; color: var(--ink-2); flex: 1 1 auto; min-width: 0; }
.field select {
  background: transparent; border: 0; border-bottom: 1px dotted var(--rule-firm);
  font-size: 11.5px; max-width: 118px; padding: 1px 0; cursor: pointer;
}
.field select:hover { border-bottom-color: var(--indigo); color: var(--indigo-ink); }
.field[data-unset="true"] { border-style: dashed; }
.field[data-unset="true"] .fl { color: var(--ink-3); }
.field[data-concern="true"] { border-left: 2px solid var(--att3); }

/* not-a-lever */
.locked { display: flex; flex-direction: column; gap: 7px; }
.lk { padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--card); }
.lk .lkh { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.lk .lkn { font-size: 12.5px; font-weight: 600; }
.lk .lkv { font-size: 11.5px; color: var(--ink-2); font-family: var(--face-num); }
.lk .lkw { font-size: 11.5px; color: var(--ink-2); margin-top: 4px; max-width: 76ch; }
.lk.protectedbox { border-left: 2px solid var(--indigo); }
.why { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 3px 20px; margin-top: 6px; }
.whyrow { font-size: 11.5px; line-height: 1.5; }
.whyn { color: var(--ink); font-weight: 600; }
.whyn::after { content: " — "; color: var(--ink-3); font-weight: 400; }
.whyt { color: var(--ink-2); }
.refusal {
  margin-top: 8px; padding: 8px 10px; border-radius: var(--r);
  background: var(--att3-bg); border-left: 2px solid var(--att3);
  font-family: var(--face-num); font-size: 11px; line-height: 1.5; white-space: pre-wrap;
}
.routes-hint { font-size: 11.5px; color: var(--ink-2); margin-top: 7px; }
.routes-hint b { color: var(--ink); }

/* footer */
.foot {
  padding: 16px 24px 26px; font-size: 11px; color: var(--ink-3);
  border-top: 1px solid var(--rule-firm); background: var(--sunk);
  display: flex; flex-direction: column; gap: 5px;
}
.foot .fm { max-width: 96ch; line-height: 1.55; }
.foot code { font-family: var(--face-num); color: var(--ink-2); }
</style>

<div class="strip">
  <b>Dropout early warning</b>
  <span class="sep">·</span>
  <span>Screening and case support</span>
  <span class="sep">·</span>
  <span id="strip-banner">Synthetic demonstration data — no real students. Decision support only: not a diagnosis, and never a basis for automated action.</span>
  <span class="grow"></span>
  <button class="themebtn" id="theme">Theme: auto</button>
</div>

<div class="shell">
  <aside class="rail">
    <div class="railhead">
      <div class="eyebrow">Caseload</div>
      <h1 id="school-name">Term register</h1>
      <div class="sub" id="cohort-sub"></div>
    </div>

    <div class="ctrl">
      <div class="ctrl-row">
        <label for="thr">Review list: flag at or above</label>
        <span class="val num" id="thr-val"></span>
      </div>
      <input type="range" id="thr" min="2" max="60" step="1" />
      <div class="burden" id="burden" role="img"></div>
      <div class="burden-note" id="burden-note"></div>
      <div class="legend">
        <span><i style="background:var(--att3)"></i>flagged, marked High</span>
        <span><i style="background:var(--att2)"></i>flagged, not marked</span>
        <span><i style="background:var(--att1)"></i>missed, marked High</span>
        <span><i style="background:var(--sunk);border:1px solid var(--rule-firm)"></i>rest</span>
      </div>
    </div>

    <div class="ctrl">
      <input class="search" id="q" type="search" placeholder="Find a student, or a circumstance…" />
      <div class="sortrow">
        <button class="seg" id="sort-risk" aria-pressed="true"
          title="Register score, highest first">Risk</button>
        <button class="seg" id="sort-gap" aria-pressed="false"
          title="Students whose circumstances look worse than their register does">Circumstance gap</button>
        <button class="seg" id="sort-id" aria-pressed="false" title="As the register lists them">Register</button>
      </div>
      <div class="sorthint" id="sorthint"></div>
    </div>

    <ul class="list" id="list"></ul>
  </aside>

  <main class="record" id="record"></main>
</div>

<script>/* Exact Bayesian-network inference for the case tool: variable elimination, plus do()
   by truncated factorisation on the mutilated graph.

   This file is inlined into the built page *and* exercised by verify_infer.cjs against
   posteriors computed by pgmpy, so the browser cannot silently disagree with the model.

   Factor convention matches numpy's C-order ravel of a pgmpy TabularCPD:
     vars = [variable, ...parents], card = [cardinality of each], and in `values` the
     LAST variable varies fastest. */

function createEngine(spec) {
  const nodes = spec.nodes;
  const byName = new Map(nodes.map(n => [n.name, n]));
  const cardOf = new Map(nodes.map(n => [n.name, n.states.length]));
  const indexOf = new Map(
    nodes.map(n => [n.name, new Map(n.states.map((s, i) => [s, i]))])
  );

  /* ---------------------------------------------------------------- factor algebra */

  function strides(card) {
    const s = new Array(card.length);
    let acc = 1;
    for (let i = card.length - 1; i >= 0; i--) { s[i] = acc; acc *= card[i]; }
    return s;
  }

  function baseFactor(node) {
    const vars = [node.name, ...node.parents];
    return {
      vars,
      card: vars.map(v => cardOf.get(v)),
      values: Float64Array.from(node.cpd)
    };
  }

  /* Fix the listed variables to a state, dropping them from the factor's scope. */
  function reduce(factor, fixed) {
    const keep = [], drop = [];
    factor.vars.forEach((v, i) => (fixed.has(v) ? drop : keep).push(i));
    if (drop.length === 0) return factor;

    const src = strides(factor.card);
    let offset = 0;
    for (const i of drop) offset += src[i] * fixed.get(factor.vars[i]);

    const vars = keep.map(i => factor.vars[i]);
    const card = keep.map(i => factor.card[i]);
    const size = card.reduce((a, b) => a * b, 1);
    const values = new Float64Array(size);
    const idx = new Array(keep.length).fill(0);

    for (let flat = 0; flat < size; flat++) {
      let off = offset;
      for (let k = 0; k < keep.length; k++) off += src[keep[k]] * idx[k];
      values[flat] = factor.values[off];
      for (let k = keep.length - 1; k >= 0; k--) {
        if (++idx[k] < card[k]) break;
        idx[k] = 0;
      }
    }
    return { vars, card, values };
  }

  function multiply(factors) {
    const vars = [];
    for (const f of factors) for (const v of f.vars) if (!vars.includes(v)) vars.push(v);
    const card = vars.map(v => cardOf.get(v));
    const size = card.reduce((a, b) => a * b, 1);
    const values = new Float64Array(size).fill(1);

    /* For each input factor, precompute the stride it advances per output variable. */
    const plans = factors.map(f => {
      const fs = strides(f.card);
      const step = vars.map(v => {
        const i = f.vars.indexOf(v);
        return i === -1 ? 0 : fs[i];
      });
      return { f, step };
    });

    const idx = new Array(vars.length).fill(0);
    for (let flat = 0; flat < size; flat++) {
      let product = 1;
      for (const { f, step } of plans) {
        let off = 0;
        for (let k = 0; k < vars.length; k++) off += step[k] * idx[k];
        product *= f.values[off];
      }
      values[flat] = product;
      for (let k = vars.length - 1; k >= 0; k--) {
        if (++idx[k] < card[k]) break;
        idx[k] = 0;
      }
    }
    return { vars, card, values };
  }

  function marginalize(factor, victim) {
    const at = factor.vars.indexOf(victim);
    if (at === -1) return factor;
    const src = strides(factor.card);
    const vars = factor.vars.filter((_, i) => i !== at);
    const card = factor.card.filter((_, i) => i !== at);
    const size = card.reduce((a, b) => a * b, 1);
    const values = new Float64Array(size);
    const keep = factor.vars.map((_, i) => i).filter(i => i !== at);
    const idx = new Array(keep.length).fill(0);

    for (let flat = 0; flat < size; flat++) {
      let off = 0;
      for (let k = 0; k < keep.length; k++) off += src[keep[k]] * idx[k];
      let sum = 0;
      for (let s = 0; s < factor.card[at]; s++) sum += factor.values[off + src[at] * s];
      values[flat] = sum;
      for (let k = keep.length - 1; k >= 0; k--) {
        if (++idx[k] < card[k]) break;
        idx[k] = 0;
      }
    }
    return { vars, card, values };
  }

  /* ------------------------------------------------------------------- elimination */

  /* Greedy min-fill: eliminate the variable whose removal adds fewest new neighbours. */
  function order(factors, keep) {
    const adj = new Map();
    const touch = v => { if (!adj.has(v)) adj.set(v, new Set()); return adj.get(v); };
    for (const f of factors) {
      for (const a of f.vars) {
        touch(a);
        for (const b of f.vars) if (a !== b) touch(a).add(b);
      }
    }
    const remaining = new Set([...adj.keys()].filter(v => v !== keep));
    const seq = [];
    while (remaining.size) {
      let best = null, bestFill = Infinity;
      for (const v of remaining) {
        const nb = [...adj.get(v)].filter(n => remaining.has(n));
        let fill = 0;
        for (let i = 0; i < nb.length; i++)
          for (let j = i + 1; j < nb.length; j++)
            if (!adj.get(nb[i]).has(nb[j])) fill++;
        if (fill < bestFill) { bestFill = fill; best = v; if (fill === 0) break; }
      }
      const nb = [...adj.get(best)].filter(n => remaining.has(n) && n !== best);
      for (let i = 0; i < nb.length; i++)
        for (let j = i + 1; j < nb.length; j++) {
          adj.get(nb[i]).add(nb[j]);
          adj.get(nb[j]).add(nb[i]);
        }
      remaining.delete(best);
      seq.push(best);
    }
    return seq;
  }

  /* Query P(target | evidence) or P(target | do(intervention), evidence).
     do() is truncated factorisation: the intervened variable's own conditional is
     dropped (cutting every edge into it) and its assigned value is held fixed
     wherever it appears as a parent. Its now-irrelevant marginal would cancel in the
     normalisation anyway, which is why dropping the factor outright is exact. */
  function query(target, evidence, intervention) {
    const ev = evidence || {};
    const iv = intervention || {};

    for (const [v, s] of Object.entries({ ...ev, ...iv })) {
      if (!byName.has(v)) throw new Error(`unknown variable ${v}`);
      if (!indexOf.get(v).has(s)) throw new Error(`unknown state ${v}=${s}`);
    }
    for (const v of Object.keys(iv)) {
      if (v in ev) throw new Error(`${v} is both an intervention and an observation`);
      if (!byName.get(v).modifiable) throw new Error(`${v} is not modifiable`);
    }

    const fixed = new Map();
    for (const [v, s] of Object.entries({ ...ev, ...iv })) fixed.set(v, indexOf.get(v).get(s));

    let factors = [];
    for (const node of nodes) {
      if (node.name in iv) continue;            // edges into the intervened node are cut
      factors.push(reduce(baseFactor(node), fixed));
    }
    factors = factors.filter(f => f.vars.length > 0);

    for (const victim of order(factors, target)) {
      const hit = factors.filter(f => f.vars.includes(victim));
      if (!hit.length) continue;
      factors = factors.filter(f => !f.vars.includes(victim));
      factors.push(marginalize(hit.length === 1 ? hit[0] : multiply(hit), victim));
    }

    const live = factors.filter(f => f.vars.length > 0);
    const joint = live.length === 1 ? live[0] : multiply(live);
    if (joint.vars.length !== 1 || joint.vars[0] !== target)
      throw new Error(`elimination left ${JSON.stringify(joint.vars)}`);

    const total = joint.values.reduce((a, b) => a + b, 0);
    const out = {};
    byName.get(target).states.forEach((s, i) => { out[s] = joint.values[i] / total; });
    return out;
  }

  return { query, nodes, byName };
}

for (const n of NODES) for (const p of n.parents) children.get(p).push(n.name);

function descendants(v) {
  const seen = new Set(), stack = [v];
  while (stack.length) for (const c of children.get(stack.pop())) {
    if (!seen.has(c)) { seen.add(c); stack.push(c); }
  }
  return seen;
}

const MODIFIABLE = NODES.filter(n => n.modifiable).map(n => n.name);

/* Variables that are neither modifiable nor downstream of anything modifiable. These are
   the only things it is safe to condition on when estimating what an action would do:
   conditioning on a variable the action is meant to change would block its own effect. */
const DOWNSTREAM = new Set(MODIFIABLE);
for (const v of MODIFIABLE) for (const d of descendants(v)) DOWNSTREAM.add(d);
const BACKGROUND = NODES.map(n => n.name).filter(n => n !== T && !DOWNSTREAM.has(n));

const PARENTS_OF_TARGET = N.get(T).parents.slice();
const CONCERN = new Map(NODES.map(n => [n.name, n.states[n.concern.indexOf(true)] || null]));
const REFERENCE = new Map(NODES.map(n => [n.name, n.states[n.concern.indexOf(false)]]));

/* Groups that describe circumstances rather than symptoms. "What's behind it" ranks these;
   the mediators are shown as signs on the record and inside the routes instead. */
const CIRCUMSTANCE_GROUPS = new Set(["Home", "School", "Access"]);
const GROUP_ORDER = ["Register", "Signals", "School", "Home", "Access", "Context"];

const PRIOR = engine.query(T, {}, null);

/* Attention bands. "Watch" starts at the cohort's own unconditional rate, so the band
   means "above average for this population" rather than an arbitrary line. */
const BAND_WATCH = PRIOR.High;
const BAND_NOW = 0.30;
function band(p) {
  if (p >= BAND_NOW) return { i: 3, word: "Needs attention now", c: "var(--att3)", bg: "var(--att3-bg)" };
  if (p >= BAND_WATCH) return { i: 2, word: "Watch", c: "var(--att2)", bg: "var(--att2-bg)" };
  return { i: 1, word: "Nothing marked", c: "var(--att1)", bg: "var(--att1-bg)" };
}

const pct = (p, d = 1) => (p * 100).toFixed(d) + "%";
const pts = d => (d >= 0 ? "+" : "−") + Math.abs(d * 100).toFixed(1);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

/* ───────────────────────────────────────────────────────────── screening scores */

/* The outcome's only parents are register fields, so a complete register determines the
   estimate exactly and nothing else can move it. Memoise on the register key. */
const regKey = v => M.registerFields.map(f => v[f]).join("|");
const screenCache = new Map();
function screen(values) {
  const k = regKey(values);
  if (!screenCache.has(k)) {
    const ev = {};
    for (const f of M.registerFields) ev[f] = values[f];
    screenCache.set(k, engine.query(T, ev, null));
  }
  return screenCache.get(k);
}
for (const s of CASE) s.p = screen(s.values).High;

/* ──────────────────────────────────────────────────────────────────────── state */

const state = {
  id: null,
  threshold: 0.20,
  sort: "risk",
  q: "",
  known: {},          // variable -> state, or absent when not recorded
  plan: new Set(),
  openDriver: null,
  refusal: null
};

function loadStudent(id, mode) {
  const s = CASE.find(x => x.id === id);
  state.id = id;
  state.plan.clear();
  state.openDriver = null;
  state.refusal = null;
  state.known = {};
  if (mode === "register") for (const f of M.registerFields) state.known[f] = s.values[f];
  else Object.assign(state.known, s.values);
  renderRecord();
  renderList();
}

const student = () => CASE.find(x => x.id === state.id);

/* ───────────────────────────────────────────────────────────────── computations */

/* Best current estimate: everything recorded. */
function currentRisk() {
  return engine.query(T, state.known, null);
}

/* Context for every causal estimate on this screen. */
function bgOf(values) {
  const ctx = {};
  for (const v of BACKGROUND) if (v in values) ctx[v] = values[v];
  return ctx;
}
function bgContext() { return bgOf(state.known); }

/* Recorded modifiable circumstances, held by intervention so the comparison is between
   this student's actual situation and the same situation with one thing changed. */
function leversOf(values) {
  const cur = {};
  for (const v of MODIFIABLE) if (v in values) cur[v] = values[v];
  return cur;
}
function recordedLevers() { return leversOf(state.known); }

/* Risk read from circumstances alone, with the attendance and engagement signs left free.
   Where this runs well ahead of the register score, the circumstances are worse than the
   attendance has shown so far -- which is the only thing in this tool that finds a student
   the register has not flagged yet. */
function circumstanceRisk(values) {
  return engine.query(T, bgOf(values), leversOf(values)).High;
}

for (const s of CASE) {
  s.c = circumstanceRisk(s.values);
  s.gap = s.c - s.p;
}
/* A positive gap is the norm, not a finding: the circumstance estimate averages over
   attendance while the register score conditions on it. Only the tail is worth marking --
   at 15 points that is 27 of 240 here, and every one of them sits off a 0.20 review list.
   Deliberately no claim that the gap predicts the outcome: the synthetic cohort's
   apparent enrichment rests on two events. */
const GAP_MARK = 0.15;

function actionBaseline() {
  return engine.query(T, bgContext(), recordedLevers()).High;
}

function actionCandidates() {
  const ctx = bgContext(), cur = recordedLevers(), base = actionBaseline();
  const out = [];
  for (const v of MODIFIABLE) {
    const node = N.get(v);
    if (!(v in state.known)) continue;
    if (state.known[v] === node.action.target) continue;
    const after = engine.query(T, ctx, { ...cur, [v]: node.action.target }).High;
    out.push({ v, node, base, after, delta: after - base });
  }
  out.sort((a, b) => a.delta - b.delta);
  return out;
}

function planEffect() {
  const ctx = bgContext(), cur = recordedLevers(), base = actionBaseline();
  if (!state.plan.size) return { base, after: base, delta: 0 };
  const iv = { ...cur };
  for (const v of state.plan) iv[v] = N.get(v).action.target;
  const after = engine.query(T, ctx, iv).High;
  return { base, after, delta: after - base };
}

/* "What's behind it": association between a recorded circumstance and the outcome, on a
   like-background basis, with the downstream signs left free. Same estimand for every
   row so the ranking is meaningful; deliberately NOT presented as an effect of acting. */
function drivers() {
  const ctx = bgContext();
  const out = [];
  for (const n of NODES) {
    if (n.name === T || !CIRCUMSTANCE_GROUPS.has(n.group)) continue;
    const concern = CONCERN.get(n.name);
    if (!concern || !(n.name in state.known)) continue;
    if (state.known[n.name] !== concern) continue;
    const ref = REFERENCE.get(n.name);
    const bad = engine.query(T, { ...ctx, [n.name]: concern }, null).High;
    const good = engine.query(T, { ...ctx, [n.name]: ref }, null).High;
    out.push({ v: n.name, node: n, delta: bad - good, ref });
  }
  out.sort((a, b) => b.delta - a.delta);
  return out;
}

/* Unrecorded circumstances, ranked by how much of a lever they would be if they turned
   out to be a problem. This is the "what to find out next" question, and for modifiable
   variables it is a causal contrast between the two states of the same lever. */
function worthAsking() {
  const ctx = bgContext(), cur = recordedLevers();
  const out = [];
  for (const n of NODES) {
    if (n.name === T || n.name in state.known) continue;
    if (!CIRCUMSTANCE_GROUPS.has(n.group)) continue;
    const concern = CONCERN.get(n.name), ref = REFERENCE.get(n.name);
    if (!concern) continue;
    let bad, good, causal;
    if (n.modifiable) {
      bad = engine.query(T, ctx, { ...cur, [n.name]: concern }).High;
      good = engine.query(T, ctx, { ...cur, [n.name]: n.action.target }).High;
      causal = true;
    } else {
      bad = engine.query(T, { ...ctx, [n.name]: concern }, null).High;
      good = engine.query(T, { ...ctx, [n.name]: ref }, null).High;
      causal = false;
    }
    out.push({ v: n.name, node: n, swing: bad - good, causal });
  }
  out.sort((a, b) => b.swing - a.swing);
  return out;
}

/* Every directed route from a circumstance to the outcome, shortest first. */
function routes(from) {
  const found = [];
  (function walk(node, path, seen) {
    if (node === T) { found.push(path.slice()); return; }
    if (path.length > 7) return;
    for (const c of children.get(node)) {
      if (seen.has(c)) continue;
      seen.add(c); path.push(c);
      walk(c, path, seen);
      path.pop(); seen.delete(c);
    }
  })(from, [from], new Set([from]));
  found.sort((a, b) => a.length - b.length);
  return found;
}

/* ────────────────────────────────────────────────────────────── caseload render */

function visibleCases() {
  const q = state.q.trim().toLowerCase();
  let rows = CASE;
  if (q) {
    /* Match the student's actual situation, not the list of things a record can hold: every
       student has a "bullying and exclusion" field, so matching field labels unconditionally
       would return the whole caseload. A field label only counts when that field is in the
       state that warrants attention; state labels always count, so "estate" still works. */
    rows = rows.filter(s => {
      if (s.id.toLowerCase().includes(q)) return true;
      for (const [v, st] of Object.entries(s.values)) {
        const n = N.get(v);
        const i = n.states.indexOf(st);
        if (n.stateLabels[i].toLowerCase().includes(q)) return true;
        if (n.concern[i] === true && n.label.toLowerCase().includes(q)) return true;
      }
      return false;
    });
  }
  rows = rows.slice();
  if (state.sort === "risk") rows.sort((a, b) => b.p - a.p || a.id.localeCompare(b.id));
  else if (state.sort === "gap") rows.sort((a, b) => b.gap - a.gap || a.id.localeCompare(b.id));
  else rows.sort((a, b) => a.id.localeCompare(b.id));
  return rows;
}

function renderBurden() {
  const t = state.threshold;
  const flagged = CASE.filter(s => s.p >= t);
  const marked = CASE.filter(s => s.simulated === "High");
  const tp = flagged.filter(s => s.simulated === "High").length;
  const fp = flagged.length - tp;
  const fn = marked.length - tp;
  const tn = CASE.length - tp - fp - fn;

  const bar = document.getElementById("burden");
  bar.textContent = "";
  const seg = (n, color, title) => {
    if (!n) return;
    const s = el("span");
    s.style.width = (100 * n / CASE.length) + "%";
    s.style.background = color;
    s.title = title;
    bar.appendChild(s);
  };
  seg(tp, "var(--att3)", `${tp} flagged and marked High`);
  seg(fp, "var(--att2)", `${fp} flagged, not marked High`);
  seg(fn, "var(--att1)", `${fn} marked High but not flagged`);
  seg(tn, "var(--sunk)", `${tn} neither`);
  bar.setAttribute("aria-label",
    `${flagged.length} of ${CASE.length} flagged; ${tp} of ${marked.length} marked High are on the list`);

  const hitRate = flagged.length ? tp / flagged.length : 0;
  document.getElementById("burden-note").innerHTML =
    `<b>${flagged.length}</b> of ${CASE.length} students on the review list. ` +
    `<b>${tp}</b> of the ${marked.length} this synthetic cohort marks High are on it; ` +
    `<b>${fp}</b> on it are not marked; <b>${fn}</b> marked students are not on it. ` +
    `So roughly ${pct(hitRate, 0)} of the visits would reach a student the cohort marks High.`;
  document.getElementById("thr-val").textContent = t.toFixed(2);
}

function renderList() {
  const ul = document.getElementById("list");
  ul.textContent = "";
  const rows = visibleCases();
  if (!rows.length) {
    ul.appendChild(el("li", "empty", "Nothing matches that."));
    return;
  }
  const frag = document.createDocumentFragment();
  for (const s of rows) {
    const b = band(s.p);
    const li = el("li");
    const btn = el("button", "row");
    btn.type = "button";
    if (s.id === state.id) btn.setAttribute("aria-current", "true");
    btn.dataset.flagged = String(s.p >= state.threshold);

    const stripe = el("div", "stripe");
    stripe.style.background = b.c;
    btn.appendChild(stripe);

    const who = el("div", "who");
    who.appendChild(el("div", "id", s.id.replace("SYNTH-", "")));
    const meta = el("div", "meta");
    const gb = N.get("Grade_Band"), sec = N.get("Sector");
    meta.appendChild(el("span", null, gb.stateLabels[gb.states.indexOf(s.values.Grade_Band)]));
    meta.appendChild(el("span", null, "·"));
    meta.appendChild(el("span", null, sec.stateLabels[sec.states.indexOf(s.values.Sector)]));
    if (s.gap >= GAP_MARK) {
      const g = el("span", "gapmark", `circumstances ${pct(s.c, 0)}`);
      g.title = `Circumstances alone put students like this at ${pct(s.c)}, ` +
                `against ${pct(s.p)} from the register.`;
      meta.appendChild(g);
    }
    who.appendChild(meta);
    btn.appendChild(who);

    const p = el("div", "p");
    const pv = el("div", "pv", pct(s.p));
    pv.style.color = b.i === 1 ? "var(--ink-2)" : b.c;
    p.appendChild(pv);
    p.appendChild(el("div", "flag", s.p >= state.threshold ? "on list" : ""));
    btn.appendChild(p);

    btn.addEventListener("click", () => loadStudent(s.id, "file"));
    li.appendChild(btn);
    frag.appendChild(li);
  }
  ul.appendChild(frag);
}

/* ──────────────────────────────────────────────────────────────── record render */

function panel(title, count) {
  const sec = el("section", "panel");
  const h = el("div", "ph");
  h.appendChild(el("h3", null, title));
  if (count) h.appendChild(el("span", "count", count));
  sec.appendChild(h);
  return sec;
}

function stateLabel(v, st) {
  const n = N.get(v);
  return n.stateLabels[n.states.indexOf(st)];
}

function isConcern(v, st) {
  const n = N.get(v);
  return n.concern[n.states.indexOf(st)] === true;
}

function renderRecord() {
  const host = document.getElementById("record");
  host.textContent = "";
  if (!state.id) {
    const empty = el("div", "panel");
    empty.appendChild(el("h3", null, "Pick a student from the caseload"));
    empty.appendChild(el("p", "note",
      "The list on the left is scored from the attendance register alone. Opening a record " +
      "brings in what the case file says, which is what turns a flag into something you can act on."));
    host.appendChild(empty);
    return;
  }

  const s = student();
  const post = currentRisk();
  const b = band(post.High);
  const complete = PARENTS_OF_TARGET.every(v => v in state.known);

  /* ── header ───────────────────────────────────────────────────────────────── */
  const head = el("div", "rhead");
  const idline = el("div", "idline");
  idline.appendChild(el("h2", null, s.id));
  const chips = el("div", "chips");
  const addChip = (text, cls) => chips.appendChild(el("span", cls ? "chip " + cls : "chip", text));
  if ("Grade_Band" in state.known) addChip(stateLabel("Grade_Band", state.known.Grade_Band));
  if ("Sector" in state.known) addChip(stateLabel("Sector", state.known.Sector) + " sector");
  addChip("synthetic record", "synth");
  idline.appendChild(chips);
  head.appendChild(idline);

  const rw = el("div", "riskwrap");
  const big = el("div", "bignum");
  const v = el("span", "v", (post.High * 100).toFixed(1));
  v.style.color = b.i === 1 ? "var(--ink)" : b.c;
  big.appendChild(v);
  /* Frequency framing, not a personal prediction: the number is a property of the group
     that shares this register pattern, which is exactly what the model can support. */
  big.appendChild(el("span", "pct", "% of students with this register pattern"));
  rw.appendChild(big);

  const tag = el("span", "bandtag", b.word);
  tag.style.background = b.bg; tag.style.color = b.c;
  rw.appendChild(tag);

  /* Without this the header can read "Nothing marked" on a student the tool is actively
     telling you to go and see. The band describes the register; this describes the file. */
  const cRisk = circumstanceRisk(state.known);
  if (cRisk - post.High >= GAP_MARK) {
    const ahead = el("span", "bandtag", "Circumstances ahead");
    ahead.style.background = "var(--att2-bg)";
    ahead.style.color = "var(--att2)";
    ahead.title = `Circumstances alone put students like this at ${pct(cRisk)}.`;
    rw.appendChild(ahead);
  }

  const pb = el("div", "postbar");
  const bars = el("div", "bars");
  M.targetStates.forEach((st, i) => {
    const seg = el("span");
    seg.style.width = (post[st] * 100) + "%";
    seg.style.background = ["var(--fill-low)", "var(--att2)", "var(--att3)"][i];
    seg.style.color = i === 0 ? "var(--ink-2)" : "var(--card)";
    seg.title = `${st}: ${pct(post[st], 1)}`;
    if (post[st] > 0.12) seg.textContent = pct(post[st], 0);
    bars.appendChild(seg);
  });
  pb.appendChild(bars);
  const keys = el("div", "keys");
  keys.appendChild(el("span", null, "Low — stays, attends"));
  keys.appendChild(el("span", null, "Medium — chronically absent"));
  keys.appendChild(el("span", null, "High — leaves"));
  pb.appendChild(keys);
  rw.appendChild(pb);
  head.appendChild(rw);

  const basis = el("p", "basis");
  basis.innerHTML = complete
    ? `Read from <b>attendance this term, engagement and grade band</b>. In this network those three ` +
      `are the outcome's only parents, so with all three recorded nothing else in the file changes ` +
      `this number — the rest of the record tells you <b>what to do</b>, not what to expect.`
    : `Incomplete register: <b>${PARENTS_OF_TARGET.filter(v => !(v in state.known)).map(v => N.get(v).label).join(", ")}</b> ` +
      `not recorded, so this estimate is still drawing on the rest of the file. Record those and it settles.`;
  head.appendChild(basis);

  const modes = el("div", "sortrow");
  modes.style.maxWidth = "420px";
  modes.style.marginTop = "12px";
  const mk = (label, mode, on, title) => {
    const btn = el("button", "seg", label);
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(on));
    btn.title = title;
    btn.addEventListener("click", () => loadStudent(state.id, mode));
    return btn;
  };
  const registerOnly = Object.keys(state.known).length === M.registerFields.length &&
                       M.registerFields.every(f => f in state.known);
  modes.appendChild(mk("Case file loaded", "file", !registerOnly, "Everything the record holds"));
  modes.appendChild(mk("Register only", "register", registerOnly,
    "What the attendance register alone gives you: the same risk number, and no levers"));
  head.appendChild(modes);
  host.appendChild(head);

  /* Action-first order: why, what to do, what to find out, then the record itself, then
     the two panels that explain and constrain the model. */
  host.appendChild(driversPanel());
  host.appendChild(actionsPanel());
  const ask = askPanel();
  if (ask) host.appendChild(ask);
  host.appendChild(recordPanel());
  host.appendChild(screeningPanel());
  host.appendChild(lockedPanel());

  /* ── footer ───────────────────────────────────────────────────────────────── */
  const foot = el("div", "foot");
  const f1 = el("div", "fm");
  f1.innerHTML = `<code>${M.variant}</code> variant · fingerprint <code>${M.fingerprint}</code> · ` +
    `seed <code>${M.seed}</code> · inference runs in this page and agrees with pgmpy to 3e-11 across ` +
    `100 fixture cases, joint interventions included.`;
  foot.appendChild(f1);
  foot.appendChild(el("div", "fm", M.provenance));
  foot.appendChild(el("div", "fm", M.caveat));
  host.appendChild(foot);
}

function screeningPanel() {
  const sec = panel("Screening, in full");
  const s = student();
  sec.appendChild(Object.assign(el("p", "note"), {
    innerHTML: "Because the outcome's only parents are the three register fields, the whole screening " +
      "model is this table — twelve numbers. Every student with a complete register lands in one cell, " +
      "which is also why the caseload has so many ties: it gives you a <b>shortlist, not a ranking</b>."
  }));

  const gb = N.get("Grade_Band"), ca = N.get("Current_Attendance"), se = N.get("School_Engagement");
  const wrap = el("div", "mtx");
  const tbl = el("table", "grid");
  const thead = el("thead");
  const hr = el("tr");
  hr.appendChild(el("th", null, "Attendance / engagement"));
  gb.states.forEach((g, i) => hr.appendChild(el("th", null, gb.stateLabels[i])));
  thead.appendChild(hr);
  tbl.appendChild(thead);

  const tb = el("tbody");
  for (const a of ca.states) for (const e of se.states) {
    const tr = el("tr");
    const th = el("th", null,
      `${ca.stateLabels[ca.states.indexOf(a)]} · ${se.stateLabels[se.states.indexOf(e)]}`);
    tr.appendChild(th);
    for (const g of gb.states) {
      const p = engine.query(T, { Current_Attendance: a, School_Engagement: e, Grade_Band: g }, null).High;
      const td = el("td", null, pct(p));
      td.style.color = band(p).i === 1 ? "var(--ink-2)" : band(p).c;
      if (state.known.Current_Attendance === a && state.known.School_Engagement === e &&
          state.known.Grade_Band === g) {
        td.className = "here";
        td.title = "This student";
      }
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
  tbl.appendChild(tb);
  const cap = el("caption",  null,
    "P(leaves next term). Attendance last term is the fourth register field and is not a parent of " +
    "the outcome, so once this term's attendance is known it changes nothing here.");
  tbl.appendChild(cap);
  wrap.appendChild(tbl);
  sec.appendChild(wrap);
  return sec;
}

function driversPanel() {
  const rows = drivers();
  const sec = panel("What's behind it", rows.length ? `${rows.length} recorded` : "");
  sec.appendChild(Object.assign(el("p", "note"), {
    innerHTML: "Recorded circumstances, ranked by how much they are <b>associated</b> with leaving for a " +
      "student of this background — not by what changing them would achieve. That is the next panel. " +
      "Open a row to see the route the model believes it travels."
  }));

  if (!rows.length) {
    sec.appendChild(el("p", "note",
      "Nothing recorded in the case file yet, so there is nothing here to explain the flag. " +
      "This is the honest state of a register-only screen: a number and no story."));
    return sec;
  }

  const max = Math.max(...rows.map(r => Math.abs(r.delta)), 1e-9);
  const box = el("div", "rows");
  for (const r of rows) {
    const btn = el("button", "dr");
    btn.type = "button";
    btn.setAttribute("aria-expanded", String(state.openDriver === r.v));
    btn.appendChild(el("div", "lbl", r.node.label));

    const st = el("div", "st");
    const dot = el("span", "dot");
    dot.style.background = "var(--att3)";
    st.appendChild(dot);
    st.appendChild(el("span", null, stateLabel(r.v, state.known[r.v])));
    btn.appendChild(st);

    const track = el("div", "track");
    const fill = el("span");
    fill.style.left = "0";
    fill.style.width = (100 * Math.abs(r.delta) / max) + "%";
    fill.style.background = r.node.modifiable ? "var(--att3)" : "var(--att1)";
    track.appendChild(fill);
    btn.appendChild(track);

    btn.appendChild(el("div", "amt", pts(r.delta)));
    btn.addEventListener("click", () => {
      state.openDriver = state.openDriver === r.v ? null : r.v;
      renderRecord();
    });
    box.appendChild(btn);

    if (state.openDriver === r.v) box.appendChild(routeBox(r));
  }
  sec.appendChild(box);
  sec.appendChild(el("p", "note",
    "Percentage points on the risk of leaving, comparing this circumstance against its better state " +
    "for a student with the same background. Solid bars are things a school can act on; " +
    "pale bars are circumstances it cannot."));
  return sec;
}

function routeBox(r) {
  const all = routes(r.v);
  const box = el("div", "route");
  box.appendChild(el("div", "cap", `How it reaches the outcome — shortest of ${all.length} route${all.length === 1 ? "" : "s"}`));
  const chain = el("div", "chain");
  all[0].forEach((v, i) => {
    if (i) chain.appendChild(el("span", "arrow", "→"));
    const hop = el("div", "hop");
    hop.appendChild(el("span", "hl", N.get(v).label));
    if (v === T) {
      hop.appendChild(el("span", "hs", pct(currentRisk().High)));
      hop.style.borderColor = "var(--att3)";
    } else if (v in state.known) {
      const known = state.known[v];
      hop.appendChild(el("span", "hs", stateLabel(v, known)));
      if (isConcern(v, known)) hop.style.borderColor = "var(--att3)";
    } else {
      const c = CONCERN.get(v);
      const p = c ? engine.query(v, state.known, null)[c] : null;
      hop.appendChild(el("span", "hs", p === null ? "not recorded" : `${pct(p, 0)} likely`));
      hop.style.borderStyle = "dashed";
    }
    chain.appendChild(hop);
  });
  box.appendChild(chain);
  const tail = el("p", "tail");
  tail.textContent = r.node.modifiable
    ? `Each step is an expert hypothesis awaiting validation, not an established fact. ` +
      `“${r.node.action.action}” acts on the first link.`
    : `Each step is an expert hypothesis awaiting validation, not an established fact. ` +
      `This circumstance is not something a school can change — the levers on this route are further along it.`;
  box.appendChild(tail);
  return box;
}

function actionsPanel() {
  const cands = actionCandidates();
  const sec = panel("What we could do", cands.length ? `${cands.length} available` : "");
  const base = actionBaseline();

  sec.appendChild(Object.assign(el("p", "note tight"), {
    innerHTML: `Estimated by intervening on the model: this student's background is held as recorded, ` +
      `their other circumstances are held as the file has them, and the attendance and engagement signs ` +
      `are left free — <b>those are what the action is meant to change</b>, so conditioning on them would ` +
      `hide the effect entirely.`
  }));
  sec.appendChild(Object.assign(el("p", "note"), {
    innerHTML: `Starting point for the figures below: <b class="num">${pct(base)}</b>. That is deliberately ` +
      `not the number at the top of the record — the top number reads attendance and engagement as they ` +
      `stand, these estimates leave them free.`
  }));

  /* Where circumstances sit well above the register score, the gap is the finding. Saying so
     turns a confusing discrepancy into the one thing that spots a student before attendance
     does -- while being explicit that the model has no dynamics and cannot forecast drift. */
  const reg = currentRisk().High;
  if (base - reg >= GAP_MARK) {
    sec.appendChild(Object.assign(el("p", "aheadline"), {
      innerHTML: `On circumstances alone, students like this sit at <b class="num">${pct(base)}</b> — ` +
        `well above the <b class="num">${pct(reg)}</b> the register shows. The circumstances here are ` +
        `worse than the attendance has shown so far, which is the gap worth a conversation. ` +
        `This model has no sense of time and cannot tell you whether attendance will follow.`
    }));
  }

  if (!cands.length) {
    sec.appendChild(el("p", "note",
      Object.keys(state.known).length <= M.registerFields.length
        ? "No levers, because nothing is recorded beyond the register. The register can tell you who to " +
          "go and see; only the visit tells you what to do."
        : "Nothing in the file is currently in a state a school can improve."));
    return sec;
  }

  sec.appendChild(planBar());

  for (const c of cands) {
    const card = el("div", "act");
    card.dataset.on = String(state.plan.has(c.v));

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = state.plan.has(c.v);
    cb.id = "act-" + c.v;
    cb.addEventListener("change", () => {
      if (cb.checked) state.plan.add(c.v); else state.plan.delete(c.v);
      renderRecord();
    });
    card.appendChild(cb);

    const body = el("div", "body");
    const label = el("label", "an", c.node.action.action);
    label.setAttribute("for", cb.id);
    body.appendChild(label);
    body.appendChild(el("div", "ao",
      `${c.node.action.owner} · ${c.node.label}: ${stateLabel(c.v, state.known[c.v])} → ${stateLabel(c.v, c.node.action.target)}`));
    body.appendChild(el("div", "ad", c.node.action.detail));
    if (c.node.action.caveat) body.appendChild(el("div", "caveat", c.node.action.caveat));
    card.appendChild(body);

    const fx = el("div", "fx");
    fx.appendChild(el("div", "fxd", pts(c.delta)));
    fx.appendChild(el("div", "fxt", "points"));
    fx.appendChild(el("div", "from", `${pct(c.base)} → ${pct(c.after)}`));
    card.appendChild(fx);
    sec.appendChild(card);
  }

  return sec;
}

function planBar() {
  const bar = el("div", "plan");
  bar.dataset.active = String(state.plan.size > 0);
  const prose = txt => {
    const s = el("span", "pl", txt);
    s.style.textTransform = "none";
    s.style.letterSpacing = "0";
    return s;
  };

  if (!state.plan.size) {
    bar.appendChild(el("span", "pl", "Plan"));
    bar.appendChild(prose("Tick the actions you would actually take — combined effects are computed jointly."));
    return bar;
  }

  const p = planEffect();
  bar.appendChild(el("span", "pl", `Plan — ${state.plan.size} action${state.plan.size === 1 ? "" : "s"}`));
  bar.appendChild(el("span", "pv", `${pct(p.base)} → ${pct(p.after)}`));
  bar.appendChild(el("span", "pd", pts(p.delta) + " points"));
  if (state.plan.size > 1) {
    /* Interventions share pathways, so the joint effect is not the sum. Saying so stops the
       plan being read as an additive budget of savings. */
    const sum = actionCandidates().filter(c => state.plan.has(c.v)).reduce((a, c) => a + c.delta, 0);
    bar.appendChild(prose(`computed jointly, not added: the separate effects come to ${pts(sum)}, because they overlap`));
  }
  bar.appendChild(el("span", "grow"));
  const clear = el("button", "linkbtn", "Clear plan");
  clear.type = "button";
  clear.addEventListener("click", () => { state.plan.clear(); renderRecord(); });
  bar.appendChild(clear);
  return bar;
}

function askPanel() {
  const rows = worthAsking();
  if (!rows.length) return null;
  const sec = panel("Worth finding out", `${rows.length} unrecorded`);
  sec.appendChild(Object.assign(el("p", "note"), {
    innerHTML: "None of this will change the risk number — the register already fixed that. It changes " +
      "<b>what you can do about it</b>. Ranked by how big a lever each would be if it turned out to be a problem."
  }));
  const max = Math.max(...rows.map(r => Math.abs(r.swing)), 1e-9);
  const box = el("div", "rows");
  for (const r of rows) {
    const row = el("div", "dr");
    row.style.cursor = "default";
    row.appendChild(el("div", "lbl", r.node.label));
    row.appendChild(el("div", "st", r.causal ? "a lever, if true" : "context, if true"));
    const track = el("div", "track");
    const fill = el("span");
    fill.style.width = (100 * Math.abs(r.swing) / max) + "%";
    fill.style.background = r.causal ? "var(--att2)" : "var(--att1)";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("div", "amt", pts(r.swing)));
    box.appendChild(row);
  }
  sec.appendChild(box);
  return sec;
}

function lockedPanel() {
  const sec = panel("Not a lever");
  const box = el("div", "locked");

  /* Neurotype gets a card of its own, because the one thing a tool like this must never
     do is let a protected characteristic be treated as the thing to fix. Showing the
     routes makes the alternative concrete: the levers are in the school's response. */
  const nt = N.get("Neuro_Type");
  const card = el("div", "lk protectedbox");
  const h = el("div", "lkh");
  h.appendChild(el("span", "lkn", nt.label));
  if ("Neuro_Type" in state.known) h.appendChild(el("span", "lkv", stateLabel("Neuro_Type", state.known.Neuro_Type)));
  h.appendChild(el("span", "chip", "protected characteristic"));
  card.appendChild(h);
  card.appendChild(el("div", "lkw", nt.whyNotActionable));

  const all = routes("Neuro_Type");
  const firstHops = [...new Set(all.map(r => r[1]))];
  const hint = el("p", "routes-hint");
  hint.innerHTML = `Neurotype reaches the outcome by <b>${all.length} route${all.length === 1 ? "" : "s"}</b> in this ` +
    `network, every one through how the school responds: ` +
    `<b>${firstHops.map(v => N.get(v).label.toLowerCase()).join(", ")}</b>. ` +
    `There is no direct arrow, and the levers are those first steps.`;
  card.appendChild(hint);

  const tryIt = el("button", "linkbtn", "Ask what would change if this were different");
  tryIt.type = "button";
  tryIt.style.marginTop = "8px";
  tryIt.addEventListener("click", () => {
    try {
      engine.query(T, {}, { Neuro_Type: "Typical" });
      state.refusal = "The engine did not refuse. That is a defect — report it.";
    } catch (err) {
      state.refusal = M.guardrailMessage + "\n\nEngine: " + err.message;
    }
    renderRecord();
  });
  card.appendChild(tryIt);
  if (state.refusal) card.appendChild(el("div", "refusal", state.refusal));
  box.appendChild(card);

  /* Everything else compresses to one card: naming them matters, but fourteen cards of
     "you cannot do this" would bury the panels that tell you what you can. */
  const rest = NODES.filter(n =>
    n.whyNotActionable && n.name !== "Neuro_Type" && (n.protected || n.name in state.known)
  );
  const other = el("div", "lk");
  other.appendChild(el("div", "lkh")).appendChild(el("span", "lkn", "Everything else the model holds back"));
  const dl = el("div", "why");
  for (const n of rest) {
    const item = el("div", "whyrow");
    const nm = el("span", "whyn", n.label);
    item.appendChild(nm);
    item.appendChild(el("span", "whyt", n.whyNotActionable));
    dl.appendChild(item);
  }
  other.appendChild(dl);
  box.appendChild(other);

  sec.appendChild(box);
  return sec;
}

function recordPanel() {
  const s = student();
  const sec = panel("The record");
  sec.appendChild(Object.assign(el("p", "note tight"), {
    innerHTML: "Everything the file holds. Change any line and the whole screen recomputes — including " +
      "setting one back to <b>not recorded</b>, which is how the record actually arrives."
  }));

  const groups = el("div", "groups");
  for (const gname of GROUP_ORDER) {
    const members = NODES.filter(n => n.group === gname && n.name !== T);
    if (!members.length) continue;
    const g = el("div", "grp");
    g.appendChild(el("div", "gl", gname === "Register" ? "Register — sets the risk number" :
      gname === "Signals" ? "Signs this term" : gname));
    const fields = el("div", "fields");
    for (const n of members) {
      const f = el("div", "field");
      const known = state.known[n.name];
      f.dataset.unset = String(known === undefined);
      f.dataset.concern = String(known !== undefined && isConcern(n.name, known));
      const lab = el("label", "fl", n.label);
      lab.setAttribute("for", "f-" + n.name);
      f.appendChild(lab);
      const sel = document.createElement("select");
      sel.id = "f-" + n.name;
      const none = document.createElement("option");
      none.value = "";
      none.textContent = "not recorded";
      sel.appendChild(none);
      n.states.forEach((st, i) => {
        const o = document.createElement("option");
        o.value = st;
        o.textContent = n.stateLabels[i];
        sel.appendChild(o);
      });
      sel.value = known === undefined ? "" : known;
      sel.addEventListener("change", () => {
        if (sel.value === "") {
          delete state.known[n.name];
          state.plan.delete(n.name);
        } else {
          state.known[n.name] = sel.value;
          if (sel.value === (n.action && n.action.target)) state.plan.delete(n.name);
        }
        renderRecord();
      });
      f.appendChild(sel);
      fields.appendChild(f);
    }
    g.appendChild(fields);
    groups.appendChild(g);
  }
  sec.appendChild(groups);

  const reset = el("button", "linkbtn", "Reset to what the file says");
  reset.type = "button";
  reset.addEventListener("click", () => loadStudent(state.id, "file"));
  sec.appendChild(reset);
  sec.appendChild(el("p", "note", M.caseloadNote));
  return sec;
}

/* ─────────────────────────────────────────────────────────────────────── wiring */

document.getElementById("cohort-sub").textContent =
  `${CASE.length} synthetic students · scored from the register · ` +
  `cohort rate ${pct(PRIOR.High)}`;

const thr = document.getElementById("thr");
thr.value = String(Math.round(state.threshold * 100));
thr.addEventListener("input", () => {
  state.threshold = Number(thr.value) / 100;
  renderBurden();
  renderList();
});

const q = document.getElementById("q");
q.addEventListener("input", () => { state.q = q.value; renderList(); });

const SORTS = { risk: "sort-risk", gap: "sort-gap", id: "sort-id" };
const HINTS = {
  risk: "",
  gap: `How far circumstances alone run ahead of the register score. Students near the top ` +
       `are ones the review list tends to miss: their attendance is better than their ` +
       `situation would suggest. Whether it stays that way is not something this model can tell you.`,
  id: ""
};
function setSort(mode) {
  state.sort = mode;
  for (const [k, id] of Object.entries(SORTS)) {
    document.getElementById(id).setAttribute("aria-pressed", String(mode === k));
  }
  document.getElementById("sorthint").textContent = HINTS[mode];
  renderList();
}
for (const [mode, id] of Object.entries(SORTS)) {
  document.getElementById(id).addEventListener("click", () => setSort(mode));
}

const themeBtn = document.getElementById("theme");
const THEMES = ["auto", "light", "dark"];
let themeAt = 0;
themeBtn.addEventListener("click", () => {
  themeAt = (themeAt + 1) % THEMES.length;
  const t = THEMES[themeAt];
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = "Theme: " + t;
});

renderBurden();
renderList();
loadStudent(visibleCases()[0].id, "file");
</script>
